<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ODESA Panel</title>
<meta name="theme-color" content="#0A1626">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ODESA Panel">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icono-192.png">
<link rel="apple-touch-icon" href="icono-192.png">
<script src="../config.js"></script>
<style>
  :root {
    --fondo: #EEF2F6; --tarjeta: #FFFFFF; --tinta: #0E1B2B; --suave: #51606F; --linea: #D3DBE4;
    --marca: #0B3A66; --noche: #0A1626; --entrada: #13733A; --salida: #B8400C; --aviso: #8A5A00; --avisoFondo: #FFF4D6;
    --error: #A61B1B; --errorFondo: #FDE8E8; --okFondo: #E3F4E8; --azulFondo: #E6F0FA;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--fondo); color: var(--tinta); }
  body { font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; -webkit-text-size-adjust: 100%; }
  .barra { background: var(--noche); color: #fff; padding: 12px 16px; padding-top: max(12px, env(safe-area-inset-top));
    display: flex; justify-content: space-between; align-items: center; gap: 12px; position: sticky; top: 0; z-index: 5; }
  .barra .marca { font-weight: 800; letter-spacing: .05em; }
  .barra .marca span { font-weight: 500; letter-spacing: 0; opacity: .8; margin-left: 6px; }
  .barra button { background: transparent; color: #fff; border: 1px solid rgba(255,255,255,.4); padding: 8px 12px; border-radius: 10px; font-size: 14px; }
  .marco { display: block; }
  nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: #fff; border-top: 1px solid var(--linea);
    display: grid; grid-template-columns: repeat(5, 1fr); padding-bottom: env(safe-area-inset-bottom); }
  nav button { background: none; border: 0; padding: 8px 4px 10px; color: var(--suave); font-size: 12px; font-weight: 600;
    display: flex; flex-direction: column; align-items: center; gap: 3px; min-height: 58px; }
  nav button svg { width: 24px; height: 24px; }
  nav button { position: relative; }
  nav .cuenta { position: absolute; top: 4px; left: calc(50% + 6px); background: var(--salida); color: #fff; border-radius: 999px; font-size: 11px; font-weight: 800; min-width: 18px; padding: 1px 5px; line-height: 16px; }
  nav button.si { color: var(--marca); }
  nav .pie { display: none; }
  @media (min-width: 900px) { .soloCel { display: none !important; } }
  main { max-width: 1000px; margin: 0 auto; padding: 16px 16px 110px; }
  @media (min-width: 900px) {
    .marco { display: grid; grid-template-columns: 230px 1fr; min-height: calc(100vh - 56px); }
    nav { position: sticky; top: 56px; height: calc(100vh - 56px); display: flex; flex-direction: column; border-top: 0;
      border-right: 1px solid var(--linea); padding: 14px 10px; gap: 4px; }
    nav button { flex-direction: row; justify-content: flex-start; gap: 12px; font-size: 16px; padding: 12px 14px; min-height: 0; border-radius: 10px; }
    nav button.si { background: var(--azulFondo); }
    nav .cuenta { position: static; margin-left: auto; font-size: 12px; padding: 2px 8px; }
    nav .pie { display: block; margin-top: auto; font-size: 13px; color: var(--suave); padding: 10px 14px; word-break: break-all; }
    main { padding: 24px 28px 48px; width: 100%; }
  }
  h1 { font-size: 26px; line-height: 1.15; margin: 4px 0 4px; }
  h2 { font-size: 17px; margin: 0; }
  p { margin: 0 0 12px; }
  .sub { color: var(--suave); margin-bottom: 16px; }
  .sub::first-letter { text-transform: uppercase; }
  .tarjeta { background: var(--tarjeta); border: 1px solid var(--linea); border-radius: 14px; padding: 16px; margin-bottom: 14px; }
  .cab { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
  .cifras { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 14px; }
  @media (min-width: 640px) { .cifras { grid-template-columns: repeat(4, 1fr); } }
  .cifra { background: #fff; border: 1px solid var(--linea); border-radius: 14px; padding: 12px 14px; text-align: left; color: var(--tinta); }
  .cifra b { display: block; font-size: 30px; line-height: 1.1; font-variant-numeric: tabular-nums; }
  .cifra span { color: var(--suave); font-size: 14px; font-weight: 600; }
  .cifra.alerta b { color: var(--salida); }
  label { display: block; font-weight: 600; margin: 0 0 6px; }
  input[type=text], input[type=email], input[type=number], input[type=date], input[type=time], input[type=search], select, textarea {
    width: 100%; font: inherit; font-size: 17px; padding: 11px 12px; border: 2px solid var(--linea); border-radius: 10px; background: #fff; color: var(--tinta);
  }
  textarea { min-height: 110px; resize: vertical; }
  input:focus, select:focus, textarea:focus, button:focus-visible { outline: 3px solid #5AA7E8; outline-offset: 2px; }
  button { font: inherit; cursor: pointer; border-radius: 12px; border: 0; }
  .boton { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 10px 18px;
    font-weight: 700; color: #fff; background: var(--marca); }
  .boton.ancho { width: 100%; min-height: 56px; font-size: 18px; }
  .boton.claro { background: #fff; color: var(--marca); border: 2px solid var(--marca); }
  .boton.verde { background: var(--entrada); }
  .boton.naranja { background: var(--salida); }
  .boton.chico { min-height: 40px; padding: 6px 12px; font-size: 14px; }
  .boton[disabled] { opacity: .55; cursor: default; }
  .enlace { background: none; color: var(--marca); text-decoration: underline; padding: 8px 2px; }
  .campo { margin-bottom: 16px; }
  .ayuda { color: var(--suave); font-size: 14px; margin-top: 6px; }
  .fila2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .opciones { display: grid; gap: 8px; }
  .opc { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border: 2px solid var(--linea); border-radius: 12px; background: #fff; font-weight: 600; cursor: pointer; }
  .opc input { width: 20px; height: 20px; accent-color: var(--marca); margin: 0; }
  .opc.si { border-color: var(--marca); background: var(--azulFondo); }
  .opc small { margin-left: auto; color: var(--suave); font-weight: 600; }
  .segm { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; background: #fff; border: 2px solid var(--linea); border-radius: 12px; padding: 4px; }
  .segm button { background: none; padding: 10px 6px; font-weight: 700; color: var(--suave); border-radius: 9px; }
  .segm button.si { background: var(--marca); color: #fff; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
  .chip { background: #fff; border: 1px solid var(--linea); color: var(--marca); border-radius: 999px; padding: 6px 12px; font-size: 14px; font-weight: 600; }
  .lista { list-style: none; margin: 0; padding: 0; }
  .persona { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-top: 1px solid var(--linea); }
  .persona:first-child { border-top: 0; }
  .persona input { width: 22px; height: 22px; accent-color: var(--marca); flex: none; margin: 0; }
  .persona .nom { font-weight: 700; }
  .persona .det { color: var(--suave); font-size: 14px; }
  .persona .fin { margin-left: auto; display: flex; gap: 6px; align-items: center; flex: none; }
  .wa { color: var(--entrada); font-weight: 700; font-size: 14px; text-decoration: none; border: 1px solid #B9DCC5; border-radius: 999px; padding: 6px 10px; }
  .eti { display: inline-block; font-size: 12px; font-weight: 700; border-radius: 999px; padding: 2px 8px; margin-left: 4px; vertical-align: 1px; }
  .eti.gris { background: #EEF1F4; color: var(--suave); }
  .eti.naranja { background: #FCE7DC; color: #8E3209; }
  .eti.verde { background: var(--okFondo); color: var(--entrada); }
  .eti.azul { background: var(--azulFondo); color: var(--marca); }
  .eti.rojo { background: var(--errorFondo); color: var(--error); }
  .vacio { color: var(--suave); padding: 6px 0; }
  .nota { padding: 12px 14px; border-radius: 12px; margin-bottom: 14px; font-weight: 600; }
  .nota.ok { background: var(--okFondo); color: var(--entrada); }
  .nota.mal { background: var(--errorFondo); color: var(--error); }
  .nota.aviso { background: var(--avisoFondo); color: var(--aviso); }
  .barraSel { position: fixed; left: 12px; right: 12px; bottom: 76px; z-index: 7; background: var(--noche); color: #fff; border-radius: 14px;
    padding: 10px 12px 10px 16px; display: flex; align-items: center; justify-content: space-between; gap: 10px; box-shadow: 0 8px 24px rgba(0,0,0,.25); }
  .barraSel button { background: #fff; color: var(--noche); font-weight: 700; padding: 10px 14px; }
  @media (min-width: 900px) { .barraSel { left: 260px; right: 28px; bottom: 20px; max-width: 760px; } }
  .vista { border: 1px solid var(--linea); border-radius: 14px; padding: 12px 14px; background: #F7F9FB; display: flex; gap: 12px; align-items: flex-start; }
  .vista img { width: 36px; height: 36px; border-radius: 8px; flex: none; }
  .vista b { display: block; }
  .msj { border-top: 1px solid var(--linea); padding: 12px 0; }
  .msj:first-child { border-top: 0; padding-top: 0; }
  .msj .txt { white-space: pre-wrap; margin: 4px 0; }
  .msj .meta { color: var(--suave); font-size: 14px; }
  .centro { text-align: center; }
  .giro { width: 22px; height: 22px; border: 3px solid var(--linea); border-top-color: var(--marca); border-radius: 50%; animation: g 0.8s linear infinite; display: inline-block; vertical-align: middle; }
  @keyframes g { to { transform: rotate(360deg); } }
  .entrar { max-width: 440px; margin: 6vh auto 0; }
  .visualmente { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  @media (max-width: 899px) { .soloPc { display: none !important; } }
  .chatGrid { display: block; }
  @media (min-width: 900px) { .chatGrid { display: grid; grid-template-columns: 300px 1fr; gap: 16px; align-items: start; } .soloCelChat { display: none !important; } }
  .conv { display: flex; gap: 10px; align-items: center; width: 100%; text-align: left; background: #fff; border: 0; border-top: 1px solid var(--linea); padding: 12px 4px; color: var(--tinta); border-radius: 0; }
  .conv:first-child { border-top: 0; }
  .conv.si { background: var(--azulFondo); border-radius: 10px; }
  .conv .txt { flex: 1; min-width: 0; }
  .conv .nom { font-weight: 700; display: block; }
  .conv .ult { color: var(--suave); font-size: 14px; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .conv .hora { color: var(--suave); font-size: 12px; white-space: nowrap; }
  .conv .num { background: var(--salida); color: #fff; border-radius: 999px; font-size: 12px; font-weight: 800; padding: 1px 7px; }
  .hilo { display: flex; flex-direction: column; gap: 8px; max-height: 58vh; overflow: auto; padding: 4px 2px 8px; }
  .globo { max-width: 82%; padding: 9px 12px; border-radius: 14px; white-space: pre-wrap; word-wrap: break-word; line-height: 1.35; }
  .globo.tr { align-self: flex-start; background: #fff; border: 1px solid var(--linea); border-bottom-left-radius: 4px; }
  .globo.of { align-self: flex-end; background: var(--marca); color: #fff; border-bottom-right-radius: 4px; }
  .globo .pie { display: block; font-size: 12px; opacity: .75; margin-top: 4px; }
  .globo a { color: inherit; font-weight: 700; }
  .globo .rep { display: inline-block; font-size: 12px; font-weight: 800; background: var(--errorFondo); color: var(--error); border-radius: 999px; padding: 1px 8px; margin-bottom: 4px; }
  .responder { display: flex; gap: 8px; align-items: flex-end; margin-top: 10px; }
  .responder textarea { min-height: 52px; flex: 1; }
  .rep .fila { display: flex; flex-wrap: wrap; gap: 6px 16px; color: var(--suave); font-size: 14px; margin: 6px 0; }
  .rep .desc { white-space: pre-wrap; margin: 8px 0; }
  .rep .notas { white-space: pre-wrap; background: #F7F9FB; border-radius: 10px; padding: 8px 10px; font-size: 14px; color: var(--suave); margin: 8px 0; }
  .rep a { color: var(--marca); font-weight: 700; }
  .rep .acc { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  .rep textarea { min-height: 60px; }
  .rep.ACCIDENTE { border-left: 5px solid var(--error); }
  .eti.ambar { background: var(--avisoFondo); color: var(--aviso); }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<header class="barra">
  <div class="marca">ODESA<span>Panel del administrador</span></div>
  <div style="display:flex;gap:8px"><button id="instalar" hidden>Instalar</button><button id="salirCel" class="soloCel" data-a="salir" hidden>Salir</button></div>
</header>
<div class="marco">
  <nav id="nav" hidden aria-label="Secciones">
    <button data-v="hoy"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Hoy</button>
    <button data-v="enviar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 3 10 14"/><path d="M21 3l-7 18-4-7-7-4z"/></svg>Enviar</button>
    <button data-v="chat"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z"/></svg>Chat<span class="cuenta" id="cChat" hidden></span></button>
    <button data-v="reportes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3 22 20H2z"/><path d="M12 10v4.5"/><path d="M12 17.4v.1"/></svg>Reportes<span class="cuenta" id="cRep" hidden></span></button>
    <button data-v="ajustes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>Avisos</button>
    <div class="pie"><div id="pieCorreo"></div><button class="enlace" data-a="salir">Salir</button></div>
  </nav>
  <main id="app"><p class="centro"><span class="giro"></span></p></main>
</div>
<div id="barraSel" class="barraSel" hidden><span id="selTxt"></span><button data-a="escribirSel">Escribirles</button></div>

<script>
(function () {
  'use strict';
  var API = window.ODESA_API && !/PEGA_AQUI/.test(window.ODESA_API) ? window.ODESA_API : '';
  var app = document.getElementById('app');
  var S = {
    token: leer('odesa_admin_token'), correo: leer('odesa_admin_correo'), vista: 'hoy',
    hoy: null, mensajes: null, ajustes: null, sel: {}, paso: 'correo', cargando: false, nota: null,
    borrador: { para: 'SIN_ENTRADA', tipo: 'RECORDATORIO', titulo: '', texto: '', cuando: 'ya', fecha: '', hora: '', cedulas: {}, buscar: '' }
  };
  var reloj = null, invitacion = null, relojCuentas = null;
  S.chats = null; S.chatCed = ''; S.conv = null; S.reportes = null; S.filtroRep = 'PENDIENTES'; S.buscarChat = '';
  var PLANTILLAS = [
    'Recuerda marcar tu ENTRADA en la app de asistencia. Sin entrada no se cuenta tu día.',
    'Recuerda marcar tu SALIDA antes de irte de la obra. Sin salida no se cuentan tus horas.',
    'Recuerda tomarte la foto y marcar estando en la obra.'
  ];
  var TIPOS = { RECORDATORIO: 'Recordatorio', ANUNCIO: 'Anuncio', MENSAJE: 'Mensaje' };
  var TITULO_DEF = { RECORDATORIO: 'Recordatorio', ANUNCIO: 'Anuncio', MENSAJE: 'Mensaje de la oficina' };

  function guardar(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  function leer(k) { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } }
  function borrar(k) { try { localStorage.removeItem(k); } catch (e) {} }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function hora12(hhmm) {
    var m = String(hhmm || '').match(/(\d{1,2}):(\d{2})/); if (!m) return '';
    var h = +m[1], s = h < 12 ? 'a. m.' : 'p. m.'; h = h % 12 || 12; return h + ':' + m[2] + ' ' + s;
  }
  function fechaMs(ms) {
    if (!ms) return '';
    try {
      return new Date(ms).toLocaleString('es-CO', { timeZone: 'America/Bogota', weekday: 'short', day: '2-digit', month: '2-digit', hour: 'numeric', minute: '2-digit' });
    } catch (e) { return new Date(ms).toLocaleString(); }
  }
  function fechaLarga(txt) {
    var p = String(txt || '').split('-');
    var d = new Date(Date.UTC(+p[0], +p[1] - 1, +p[2], 12));
    try { return d.toLocaleDateString('es-CO', { timeZone: 'UTC', weekday: 'long', day: 'numeric', month: 'long' }); } catch (e) { return txt; }
  }
  function waNumero(c) { c = String(c || '').replace(/\D/g, ''); return c.length === 10 && c.charAt(0) === '3' ? '57' + c : c; }
  function llevaTxt(min) { if (min == null) return ''; return Math.floor(min / 60) + ' h ' + (min % 60) + ' min'; }
  function horasTxt(h) { h = Number(h) || 0; var m = Math.round(h * 60); return Math.floor(m / 60) + ' h ' + (m % 60) + ' min'; }

  function llamar(accion, datos) {
    if (!API) return Promise.reject(new Error('Falta el enlace del motor en config.js.'));
    datos = datos || {};
    if (S.token) datos.token = S.token;
    return fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ accion: accion, datos: datos }) })
      .then(function (r) { return r.json(); })
      .then(function (r) {
        if (r && r.sesion === false) { salirLocal(); throw new Error(r.mensaje || 'Tu sesión terminó.'); }
        return r;
      });
  }

  /* ---------- Entrar ---------- */
  function salirLocal() {
    S.token = ''; borrar('odesa_admin_token'); S.hoy = S.mensajes = S.ajustes = null; S.sel = {};
    document.getElementById('nav').hidden = true; document.getElementById('salirCel').hidden = true; pararReloj(); pEntrar();
    if (relojCuentas) { clearInterval(relojCuentas); relojCuentas = null; } S.chats = S.conv = S.reportes = null; S.chatCed = ''; document.title = 'ODESA Panel';
  }
  function pEntrar(nota) {
    document.getElementById('nav').hidden = true;
    document.getElementById('barraSel').hidden = true;
    var h = '<div class="entrar"><h1>Panel del administrador</h1>';
    h += '<p class="sub">Entra con tu correo. Debe ser uno de los que pueden editar la hoja de asistencia.</p>';
    if (!API) h += '<div class="nota mal">Falta el enlace del motor en config.js.</div>';
    if (nota) h += '<div class="nota ' + nota.clase + '" role="status">' + esc(nota.texto) + '</div>';
    if (S.paso === 'correo') {
      h += '<form id="fCorreo" class="tarjeta"><div class="campo"><label for="correo">Tu correo</label>' +
        '<input id="correo" type="email" autocomplete="email" required value="' + esc(S.correo) + '" placeholder="nombre@odesa.com.co"></div>' +
        '<button class="boton ancho" id="bCorreo">Enviarme el código</button></form>';
    } else {
      h += '<form id="fCodigo" class="tarjeta"><p>Escribe el código que llegó a <b>' + esc(S.correo) + '</b>.</p>' +
        '<div class="campo"><label for="codigo">Código de 6 dígitos</label>' +
        '<input id="codigo" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6" required style="font-size:26px;letter-spacing:.3em;text-align:center"></div>' +
        '<button class="boton ancho" id="bCodigo">Entrar</button>' +
        '<p class="centro" style="margin:10px 0 0"><button type="button" class="enlace" data-a="otroCorreo">Usar otro correo o pedir otro código</button></p></form>';
    }
    h += '</div>';
    app.innerHTML = h;
    var c = document.getElementById(S.paso === 'correo' ? 'correo' : 'codigo'); if (c) c.focus();
  }
  function pedirCodigo(ev) {
    ev.preventDefault();
    var correo = document.getElementById('correo').value.trim().toLowerCase();
    var b = document.getElementById('bCorreo'); b.disabled = true; b.textContent = 'Enviando…';
    llamar('adminCodigo', { correo: correo }).then(function (r) {
      if (!r.ok) { b.disabled = false; b.textContent = 'Enviarme el código'; return pEntrar({ clase: 'mal', texto: r.mensaje }); }
      S.correo = correo; guardar('odesa_admin_correo', correo); S.paso = 'codigo';
      pEntrar({ clase: 'ok', texto: r.mensaje });
    }).catch(function (e) { pEntrar({ clase: 'mal', texto: 'No hubo conexión. ' + e.message }); });
  }
  function entrar(ev) {
    ev.preventDefault();
    var codigo = document.getElementById('codigo').value.replace(/\D/g, '');
    var b = document.getElementById('bCodigo'); b.disabled = true; b.textContent = 'Revisando…';
    llamar('adminEntrar', { correo: S.correo, codigo: codigo }).then(function (r) {
      if (!r.ok) { return pEntrar({ clase: 'mal', texto: r.mensaje }); }
      S.token = r.token; guardar('odesa_admin_token', r.token); S.paso = 'correo';
      iniciarPanel();

    if (v === 'chat') { cargarChats(); if (!S.hoy) cargarHoy(true, function () { if (S.vista === 'chat') pChat(); }); reloj = setInterval(function () { if (document.visibilityState === 'visible') refrescarChat(); }, 15000); }

  }
  function pararReloj() { if (reloj) { clearInterval(reloj); reloj = null; } }

  }
  function grupos() {
    var g = { SIN_ENTRADA: [], TRABAJANDO: [], SALIO: [], SIN_SALIDA: [] };

  }

    h += '<div class="cifras">' +

  }
  function cifra(txt, n, alerta) { return '<div class="cifra' + (alerta ? ' alerta' : '') + '"><b>' + n + '</b><span>' + esc(txt) + '</span></div>'; }
  function grupo(titulo, lista, para, accion, plantilla) {
    var h = '<section class="tarjeta"><div class="cab"><h2>' + esc(titulo) + ' (' + lista.length + ')</h2>';
    if (para && lista.length) h += '<button class="boton chico ' + (para === 'SIN_ENTRADA' ? 'verde' : 'naranja') + '" data-a="rapido" data-para="' + para + '" data-p="' + plantilla + '">' + esc(accion) + '</button>';
    h += '</div>';
    if (!lista.length) return h + '<p class="vacio">Nadie por ahora.</p></section>';
    h += '<ul class="lista">';
    lista.forEach(function (p) {
      var det = [];
      if (p.cargo) det.push(p.cargo);
      if (p.situacion === 'TRABAJANDO') det.push(p.obra + ' · entró ' + hora12(p.entrada) + ' · lleva ' + llevaTxt(p.lleva));
      if (p.situacion === 'SALIO') det.push(p.obra + ' · ' + hora12(p.entrada) + ' – ' + hora12(p.salida) + ' · ' + horasTxt(p.horas));
      if (p.situacion === 'SIN_SALIDA') det.push(p.obra + ' · entró ' + hora12(p.entrada));
      var etis = (p.avisos ? '' : '<span class="eti naranja">sin avisos</span>') + (p.porValidar ? '<span class="eti gris">por validar</span>' : '') +

      h += '<li class="persona"><input type="checkbox" aria-label="Elegir a ' + esc(p.nombre) + '" data-sel="' + esc(p.cedula) + '"' + (S.sel[p.cedula] ? ' checked' : '') + '>' +
        '<div><div class="nom">' + esc(p.nombre) + etis + '</div><div class="det">' + esc(det.join(' · ')) + '</div></div>' +
        '<div class="fin"><button class="wa" style="background:#fff;color:var(--marca);border-color:#BFD3E8" data-a="abrirChat" data-ced="' + esc(p.cedula) + '">Chat</button>' +
        (p.celular ? '<a class="wa" target="_blank" rel="noopener" href="https://wa.me/' + esc(waNumero(p.celular)) + '">WhatsApp</a>' : '') + '</div></li>';

  }
  function pintarSel() {

  }

  /* ---------- Enviar ---------- */
  function cuantos(para) {
    var g = grupos();
    if (para === 'SIN_ENTRADA') return g.SIN_ENTRADA.length;
    if (para === 'SIN_SALIDA') return g.TRABAJANDO.length;

  }
  function pEnviar() {
    if (S.vista !== 'enviar') return;
    var b = S.borrador, h = '<div class="cab"><h1>Enviar mensaje</h1><button class="boton claro chico" data-a="verEnviados">Enviados y programados</button></div><p class="sub">Llega como notificación al celular de cada persona y queda guardado en su app.</p>';
    if (S.nota) h += '<div class="nota ' + S.nota.clase + '" role="status">' + esc(S.nota.texto) + '</div>';

    [['SIN_ENTRADA', 'Los que no han marcado entrada'], ['SIN_SALIDA', 'Los que no han marcado salida'], ['TODOS', 'Todos los trabajadores activos'], ['ELEGIDOS', 'Elegir personas']]
      .forEach(function (o) {
        var n = S.hoy ? cuantos(o[0]) : '…';
        h += '<label class="opc' + (b.para === o[0] ? ' si' : '') + '"><input type="radio" name="para" value="' + o[0] + '"' + (b.para === o[0] ? ' checked' : '') + '>' +
          esc(o[1]) + '<small>' + n + (n === 1 ? ' persona' : ' personas') + '</small></label>';
      });
    h += '</div>';
    if (b.para === 'SIN_ENTRADA' || b.para === 'SIN_SALIDA') h += '<p class="ayuda">Se calcula en el momento de enviar: si alguien marca antes, ya no le llega.</p>';
    h += '</div>';
    if (b.para === 'ELEGIDOS') {
      h += '<div class="campo"><input type="search" id="buscar" placeholder="Buscar por nombre" value="' + esc(b.buscar) + '"><ul class="lista" id="elegir" style="margin-top:8px;max-height:320px;overflow:auto">' + listaElegir() + '</ul></div>';
    }
    h += '</div>';
    h += '<div class="tarjeta"><div class="campo"><label>Tipo</label><div class="segm" role="group" aria-label="Tipo de mensaje">';
    Object.keys(TIPOS).forEach(function (t) { h += '<button type="button" data-a="tipo" data-t="' + t + '" class="' + (b.tipo === t ? 'si' : '') + '" aria-pressed="' + (b.tipo === t) + '">' + TIPOS[t] + '</button>'; });
    h += '</div></div>';
    h += '<div class="campo"><label for="titulo">Título <span style="font-weight:400;color:var(--suave)">(opcional)</span></label>' +
      '<input id="titulo" type="text" maxlength="60" value="' + esc(b.titulo) + '" placeholder="' + esc(TITULO_DEF[b.tipo]) + '"></div>';
    h += '<div class="campo"><label for="texto">Mensaje</label><textarea id="texto" maxlength="500" required placeholder="Escribe aquí lo que quieres decir">' + esc(b.texto) + '</textarea>' +
      '<div class="ayuda"><span id="cuenta">' + b.texto.length + '</span>/500</div>';
    if (b.tipo === 'RECORDATORIO') {
      h += '<div class="chips">' + PLANTILLAS.map(function (p, i) { return '<button type="button" class="chip" data-a="plantilla" data-p="' + i + '">' + esc(p.split('.')[0]) + '</button>'; }).join('') + '</div>';
    }
    h += '</div>';
    h += '<div class="campo"><label>Así se verá en el celular</label><div class="vista"><img src="../icono-192.png" alt=""><div><b id="vTitulo">ODESA: ' + esc(b.titulo || TITULO_DEF[b.tipo]) + '</b><span id="vTexto">' + esc(b.texto || 'Tu mensaje…') + '</span></div></div></div>';
    h += '</div>';
    h += '<div class="tarjeta"><div class="campo"><label>Cuándo</label><div class="segm" style="grid-template-columns:1fr 1fr">' +
      '<button type="button" data-a="cuando" data-c="ya" class="' + (b.cuando === 'ya' ? 'si' : '') + '">Ahora</button>' +
      '<button type="button" data-a="cuando" data-c="prog" class="' + (b.cuando === 'prog' ? 'si' : '') + '">Programar</button></div></div>';
    if (b.cuando === 'prog') {
      if (!b.fecha) { var x = proximaMediaHora(); b.fecha = x[0]; b.hora = x[1]; }
      h += '<div class="fila2"><div><label for="fecha">Fecha</label><input id="fecha" type="date" value="' + esc(b.fecha) + '"></div>' +
        '<div><label for="hora">Hora</label><input id="hora" type="time" value="' + esc(b.hora) + '"></div></div>' +
        '<p class="ayuda">Hora de Colombia. A esa hora se envía solo, aunque nadie tenga el panel abierto.</p>';

  }
  function listaElegir() {
    var b = S.borrador, q = b.buscar.toLowerCase(), h = '';
    var lista = (S.hoy ? S.hoy.personas : []).filter(function (p) { return !q || p.nombre.toLowerCase().indexOf(q) >= 0; });
    if (!lista.length) return '<li class="vacio">No hay coincidencias.</li>';
    lista.forEach(function (p) {
      h += '<li class="persona"><input type="checkbox" id="e' + esc(p.cedula) + '" data-elegir="' + esc(p.cedula) + '"' + (b.cedulas[p.cedula] ? ' checked' : '') + '>' +
        '<label for="e' + esc(p.cedula) + '" style="margin:0;font-weight:600">' + esc(p.nombre) + (p.avisos ? '' : ' <span class="eti naranja">sin avisos</span>') + '</label></li>';

  }
  function proximaMediaHora() {
    var d = new Date(Date.now() - 5 * 3600000 + 30 * 60000), m = d.getUTCMinutes();
    d.setUTCMinutes(m < 30 ? 30 : 60, 0, 0);
    var p = function (n) { return ('0' + n).slice(-2); };
    return [d.getUTCFullYear() + '-' + p(d.getUTCMonth() + 1) + '-' + p(d.getUTCDate()), p(d.getUTCHours()) + ':' + p(d.getUTCMinutes())];
  }
  function leerBorrador() {
    var b = S.borrador, t = document.getElementById('titulo'), x = document.getElementById('texto');
    if (t) b.titulo = t.value; if (x) b.texto = x.value;
    var f = document.getElementById('fecha'), h = document.getElementById('hora');

  }
  function enviar(ev) {
    ev.preventDefault();

    if (!b.texto.trim()) { S.nota = { clase: 'mal', texto: 'Escribe el mensaje.' }; return pEnviar(); }
    if (b.para === 'ELEGIDOS' && !Object.keys(b.cedulas).length) { S.nota = { clase: 'mal', texto: 'Elige al menos una persona.' }; return pEnviar(); }
    var n = S.hoy ? cuantos(b.para) : 0;
    if (b.cuando === 'ya' && n === 0 && S.hoy) { S.nota = { clase: 'aviso', texto: 'Ahora mismo no hay nadie en ese grupo. Revisa a quién va el mensaje.' }; return pEnviar(); }
    var datos = { para: b.para, tipo: b.tipo, titulo: b.titulo.trim(), texto: b.texto.trim(), cedulas: Object.keys(b.cedulas) };
    if (b.cuando === 'prog') datos.programar = b.fecha + 'T' + b.hora;
    var boton = document.getElementById('bEnviar'); boton.disabled = true; boton.textContent = 'Enviando…';

      if (!r.ok) { S.nota = { clase: 'mal', texto: r.mensaje }; return pEnviar(); }
      if (r.programado) S.nota = { clase: 'ok', texto: 'Quedó programado para el ' + b.fecha.split('-').reverse().join('/') + ' a las ' + hora12(b.hora) + ' (hora de Colombia). Lo puedes cancelar en Enviados.' };
      else {

        S.nota = { clase: 'ok', texto: 'Enviado a ' + r.destinatarios + (r.destinatarios === 1 ? ' persona' : ' personas') + '. ' +
          (r.entregados ? 'A ' + r.entregados + ' les llegó la notificación. ' : '') +
          (sin ? sin + (sin === 1 ? ' no tiene' : ' no tienen') + ' los avisos activados: lo verán al abrir la app.' : '') };
      }
      S.borrador = { para: b.para, tipo: b.tipo, titulo: '', texto: '', cuando: 'ya', fecha: '', hora: '', cedulas: {}, buscar: '' };
      S.mensajes = null; S.sel = {}; pintarSel();

  }

  function campoHora(id, txt, v) { return '<div class="campo"><label for="' + id + '">' + esc(txt) + '</label><input id="' + id + '" type="time" value="' + esc(v) + '"></div>'; }

  }

  /* ---------- Contadores (chat sin leer y reportes nuevos) ---------- */
  function contadores() {
    return llamar('adminContadores').then(function (r) {
      if (!r || !r.ok) return;
      pintarCuenta('cChat', r.chat); pintarCuenta('cRep', r.reportes);
      var total = (r.chat || 0) + (r.reportes || 0);
      document.title = (total ? '(' + total + ') ' : '') + 'ODESA Panel';
      if (S.vista === 'chat' && r.chat && !S.chatOcupado) refrescarChat();
    }).catch(function () {});
  }
  function pintarCuenta(id, n) { var c = document.getElementById(id); if (!c) return; c.hidden = !n; c.textContent = n > 99 ? '99+' : n; }

  /* ---------- Chat ---------- */
  function horaCorta(ms) {
    if (!ms) return '';
    try {
      var hoy = new Date().toLocaleDateString('es-CO', { timeZone: 'America/Bogota' }), d = new Date(ms);
      return d.toLocaleDateString('es-CO', { timeZone: 'America/Bogota' }) === hoy
        ? d.toLocaleTimeString('es-CO', { timeZone: 'America/Bogota', hour: 'numeric', minute: '2-digit' })
        : d.toLocaleDateString('es-CO', { timeZone: 'America/Bogota', day: 'numeric', month: 'short' });
    } catch (e) { return ''; }
  }
  function cargarChats() {
    if (!S.chats) cargando();
    return llamar('adminChats').then(function (r) {
      if (!r.ok) throw new Error(r.mensaje);
      S.chats = r.chats;
      if (S.vista === 'chat') { if (S.chatCed) abrirChat(S.chatCed, true); else pChat(); }
    }).catch(function (e) { if (S.vista === 'chat') errorRed(e, 'recargarChat'); });
  }
  function refrescarChat() {
    llamar('adminChats').then(function (r) {
      if (!r.ok || S.vista !== 'chat') return;
      S.chats = r.chats;
      if (S.chatCed) abrirChat(S.chatCed, true); else pintarListaChats();
    }).catch(function () {});
  }
  function abrirChat(ced, silencio) {
    S.chatCed = ced;
    if (!silencio) { S.conv = null; pChat(); }
    return llamar('adminChat', { cedula: ced }).then(function (r) {
      if (S.vista !== 'chat' || S.chatCed !== ced) return;
      if (!r.ok) { S.nota = { clase: 'mal', texto: r.mensaje }; S.chatCed = ''; return pChat(); }
      var antes = S.conv && S.conv.trabajador.cedula === ced ? S.conv.mensajes.length : -1;
      S.conv = r;
      (S.chats || []).forEach(function (c) { if (c.cedula === ced) c.noLeidos = 0; });
      if (antes !== r.mensajes.length || !silencio) pChat();
      contadores();
    }).catch(function (e) { if (!silencio) { S.nota = { clase: 'mal', texto: 'No se pudo abrir: ' + e.message }; pChat(); } });
  }
  function conversaciones() {
    var q = S.buscarChat.trim().toLowerCase(), lista = (S.chats || []).slice(), ya = {};
    lista.forEach(function (c) { ya[c.cedula] = true; });
    if (q) {
      lista = lista.filter(function (c) { return c.nombre.toLowerCase().indexOf(q) >= 0; });
      (S.hoy ? S.hoy.personas : []).forEach(function (p) {
        if (!ya[p.cedula] && p.nombre.toLowerCase().indexOf(q) >= 0) lista.push({ cedula: p.cedula, nombre: p.nombre, noLeidos: 0, nueva: true });
      });
    }
    return lista;
  }
  function htmlListaChats() {
    var lista = conversaciones();
    if (!lista.length) return '<p class="vacio">' + (S.buscarChat ? 'No hay nadie con ese nombre.' : 'Todavía no hay conversaciones. Cuando un trabajador escriba desde su app, aparece aquí. Para escribirle tú, búscalo arriba.') + '</p>';
    return lista.map(function (c) {
      var u = c.ultimo;
      return '<button class="conv' + (c.cedula === S.chatCed ? ' si' : '') + '" data-a="abrirChat" data-ced="' + esc(c.cedula) + '">' +
        '<span class="txt"><span class="nom">' + esc(c.nombre) + '</span><span class="ult">' +
        (c.nueva ? 'Escribirle' : esc((u.deOficina ? 'Tú: ' : '') + (u.texto || (u.foto ? 'Foto' : '')))) + '</span></span>' +
        (u ? '<span class="hora">' + esc(horaCorta(u.fecha)) + '</span>' : '') + (c.noLeidos ? '<span class="num">' + c.noLeidos + '</span>' : '') + '</button>';
    }).join('');
  }
  function pintarListaChats() { var c = document.getElementById('listaChats'); if (c) c.innerHTML = htmlListaChats(); }
  function pChat() {
    if (S.vista !== 'chat') return;
    var h = '', abierto = !!S.chatCed;
    var lista = '<div class="tarjeta' + (abierto ? ' soloPc' : '') + '" id="panelLista"><input type="search" id="buscarChat" placeholder="Buscar trabajador para escribirle" value="' + esc(S.buscarChat) + '" style="margin-bottom:8px">' +
      '<div id="listaChats">' + htmlListaChats() + '</div></div>';
    var hilo = '';
    if (abierto) {
      var c = S.conv;
      hilo = '<div class="tarjeta"><p class="soloCelChat" style="margin:0 0 6px"><button class="enlace" data-a="cerrarChat">‹ Conversaciones</button></p>';
      if (!c) hilo += '<p class="centro"><span class="giro"></span></p>';
      else {
        var t = c.trabajador;
        hilo += '<div class="cab" style="margin-bottom:6px"><div><h2>' + esc(t.nombre) + (t.avisos ? '' : '<span class="eti naranja">sin avisos</span>') + '</h2>' +
          '<div class="ayuda" style="margin:2px 0 0">' + esc([t.cargo, 'C.C. ' + t.cedula].filter(String).join(' · ')) + '</div></div>' +
          (t.celular ? '<a class="wa" target="_blank" rel="noopener" href="https://wa.me/' + esc(waNumero(t.celular)) + '">WhatsApp</a>' : '') + '</div>';
        hilo += '<div class="hilo" id="hilo">' + (c.mensajes.length ? c.mensajes.map(function (m) {
          return '<div class="globo ' + (m.deOficina ? 'of' : 'tr') + '">' + (m.reporte ? '<span class="rep">Reporte SST</span><br>' : '') + esc(m.texto) +
            (m.foto ? (m.texto ? '\n' : '') + '<a href="' + esc(m.foto) + '" target="_blank" rel="noopener">Ver foto</a>' : '') +
            (m.reporte ? '\n<a href="#" data-a="verReporte" data-id="' + esc(m.reporte) + '">Ver el reporte</a>' : '') +
            '<span class="pie">' + esc(horaCorta(m.fecha)) + (m.deOficina ? ' · ' + esc(m.por || '') + (m.leido ? ' · leído' : '') : '') + '</span></div>';
        }).join('') : '<p class="vacio">Todavía no se han escrito. Escribe abajo: le llega como notificación.</p>') + '</div>';
        if (S.nota) hilo += '<div class="nota ' + S.nota.clase + '" role="status" style="margin:10px 0 0">' + esc(S.nota.texto) + '</div>';
        hilo += '<form id="fChat" class="responder"><label for="resp" class="visualmente">Respuesta</label><textarea id="resp" maxlength="1000" placeholder="Escribe tu respuesta">' + esc(S.borradorChat || '') + '</textarea>' +
          '<button class="boton" id="bResp">Enviar</button></form>';
      }
      hilo += '</div>';
    }
    h += '<div class="cab"><h1>Chat</h1><button class="boton claro chico" data-a="recargarChat">Actualizar</button></div>';
    if (!abierto && S.nota) h += '<div class="nota ' + S.nota.clase + '">' + esc(S.nota.texto) + '</div>';
    h += '<div class="chatGrid">' + lista + (abierto ? hilo : '<div class="tarjeta soloPc"><p class="vacio">Elige una conversación.</p></div>') + '</div>';
    var y = window.scrollY, foco = document.activeElement && document.activeElement.id;
    app.innerHTML = h;
    var hl = document.getElementById('hilo'); if (hl) hl.scrollTop = hl.scrollHeight;
    if (foco === 'buscarChat' || foco === 'resp') { var f = document.getElementById(foco); if (f) { f.focus(); try { f.setSelectionRange(f.value.length, f.value.length); } catch (e) {} } }
    window.scrollTo(0, y);
  }
  function responder(ev) {
    ev.preventDefault();
    var campo = document.getElementById('resp'), texto = campo.value.trim(), b = document.getElementById('bResp');
    if (!texto) return campo.focus();
    b.disabled = true; b.textContent = 'Enviando…'; S.chatOcupado = true;
    llamar('adminChatEnviar', { cedula: S.chatCed, texto: texto }).then(function (r) {
      S.chatOcupado = false;
      if (!r.ok) { S.nota = { clase: 'mal', texto: r.mensaje }; S.borradorChat = texto; return pChat(); }
      S.borradorChat = ''; S.conv.mensajes.push(r.mensaje);
      S.nota = r.entregado ? null : { clase: 'aviso', texto: 'Quedó en su chat. No tiene los avisos activados: lo verá cuando abra la app.' };
      (S.chats || []).forEach(function (c) { if (c.cedula === S.chatCed) c.ultimo = r.mensaje; });
      if (!(S.chats || []).some(function (c) { return c.cedula === S.chatCed; })) S.chats.unshift({ cedula: S.chatCed, nombre: S.conv.trabajador.nombre, noLeidos: 0, ultimo: r.mensaje });
      pChat();
      var f = document.getElementById('resp'); if (f) f.focus();
    }).catch(function (e) { S.chatOcupado = false; S.borradorChat = texto; S.nota = { clase: 'mal', texto: 'No hubo conexión: ' + e.message + '. No se envió.' }; pChat(); });
  }

  /* ---------- Reportes SST ---------- */
  var COLOR_TIPO = { 'Accidente de trabajo': 'rojo', 'Incidente o casi accidente': 'naranja', 'Incapacidad médica': 'azul', 'Condición o acto inseguro': 'ambar', 'Otra novedad': 'gris' };
  function cargarReportes() {
    if (!S.reportes) cargando();
    llamar('adminReportes').then(function (r) {
      if (!r.ok) throw new Error(r.mensaje);
      S.reportes = r.reportes;
      if (S.vista === 'reportes') pReportes();
    }).catch(function (e) { if (S.vista === 'reportes') errorRed(e, 'recargarReportes'); });
  }
  function pReportes() {
    var todos = S.reportes, cuenta = { PENDIENTES: 0, NUEVO: 0, 'EN REVISIÓN': 0, CERRADO: 0, TODOS: todos.length };
    todos.forEach(function (r) { cuenta[r.estado] = (cuenta[r.estado] || 0) + 1; if (r.estado !== 'CERRADO') cuenta.PENDIENTES++; });
    var f = S.filtroRep, lista = todos.filter(function (r) { return f === 'TODOS' || (f === 'PENDIENTES' ? r.estado !== 'CERRADO' : r.estado === f); });
    if (S.verRep) lista = todos.filter(function (r) { return r.id === S.verRep; });
    var h = '<div class="cab"><h1>Reportes SST</h1><button class="boton claro chico" data-a="recargarReportes">Actualizar</button></div>' +
      '<p class="sub">Accidentes, incidentes, incapacidades y novedades que reportan los trabajadores desde su app. También están en la pestaña «Reportes SST» de la hoja.</p>';
    if (S.nota) h += '<div class="nota ' + S.nota.clase + '" role="status">' + esc(S.nota.texto) + '</div>';
    if (S.verRep) h += '<p><button class="enlace" data-a="todosRep">‹ Ver todos los reportes</button></p>';
    else {
      h += '<div class="chips" style="margin:0 0 14px">' + [['PENDIENTES', 'Pendientes'], ['NUEVO', 'Nuevos'], ['EN REVISIÓN', 'En revisión'], ['CERRADO', 'Cerrados'], ['TODOS', 'Todos']].map(function (x) {
        return '<button class="chip"' + (f === x[0] ? ' style="background:var(--marca);color:#fff;border-color:var(--marca)" aria-pressed="true"' : ' aria-pressed="false"') +
          ' data-a="filtroRep" data-f="' + x[0] + '">' + x[1] + ' (' + (cuenta[x[0]] || 0) + ')</button>';
      }).join('') + '</div>';
    }
    if (!lista.length) h += '<div class="tarjeta"><p class="vacio">' + (todos.length ? 'No hay reportes en este grupo.' : 'Todavía no hay reportes.') + '</p></div>';
    lista.forEach(function (r) {
      var estado = r.estado === 'NUEVO' ? '<span class="eti rojo">Nuevo</span>' : r.estado === 'CERRADO' ? '<span class="eti verde">Cerrado</span>' : '<span class="eti azul">En revisión</span>';
      var datos = [];
      if (r.obra) datos.push('Obra: ' + r.obra);
      if (r.dias) datos.push(r.dias + ' días de incapacidad' + (r.desde ? ' desde ' + fechaCorta(r.desde) : ''));
      else datos.push('Cuándo: ' + fechaMs(r.hecho));
      if (r.lesionados) datos.push('Lesionados: ' + (r.lesionados === 'SI' ? 'sí' : 'no'));
      h += '<section class="tarjeta rep ' + (r.tipo === 'Accidente de trabajo' ? 'ACCIDENTE' : '') + '">' +
        '<div><span class="eti ' + (COLOR_TIPO[r.tipo] || 'gris') + '" style="margin-left:0">' + esc(r.tipo) + '</span>' + estado + '</div>' +
        '<h2 style="margin-top:8px">' + esc(r.nombre) + '</h2><div class="fila"><span>' + esc([r.cargo, 'C.C. ' + r.cedula].filter(String).join(' · ')) + '</span><span>Reportado ' + esc(fechaMs(r.fecha)) + '</span></div>' +
        '<div class="fila">' + datos.map(function (x) { return '<span>' + esc(x) + '</span>'; }).join('') + '</div>' +
        (r.afectado || r.lesion ? '<div class="fila"><span><b>Afectado:</b> ' + esc(r.afectado || '—') + '</span><span><b>Lesión:</b> ' + esc(r.lesion || '—') + '</span></div>' : '') +
        '<div class="desc">' + esc(r.descripcion) + '</div>' +
        '<div class="fila">' + (r.foto ? '<a href="' + esc(r.foto) + '" target="_blank" rel="noopener">Ver foto</a>' : '<span>Sin foto</span>') +
        (r.ubicacion ? '<a href="' + esc(r.ubicacion) + '" target="_blank" rel="noopener">Ver ubicación</a>' : '') + '</div>' +
        (r.notas ? '<div class="notas">' + esc(r.notas) + '</div>' : '') +
        (r.estado === 'CERRADO' ? '<div class="fila"><span>Cerrado ' + esc(fechaMs(r.cerrado)) + (r.atendio ? ' por ' + esc(r.atendio) : '') + '</span></div>' : '') +
        '<label for="n' + esc(r.id) + '" class="visualmente">Nota</label><textarea id="n' + esc(r.id) + '" maxlength="1000" placeholder="Nota de seguimiento (opcional): qué se hizo, si se reportó a la ARL…"></textarea>' +
        '<div class="acc">' +
        (r.estado === 'NUEVO' ? '<button class="boton chico" data-a="estadoRep" data-id="' + esc(r.id) + '" data-e="EN REVISIÓN">Pasar a revisión</button>' : '') +
        (r.estado !== 'CERRADO' ? '<button class="boton chico verde" data-a="estadoRep" data-id="' + esc(r.id) + '" data-e="CERRADO">Cerrar</button>' :
          '<button class="boton claro chico" data-a="estadoRep" data-id="' + esc(r.id) + '" data-e="EN REVISIÓN">Reabrir</button>') +
        (r.estado !== 'NUEVO' ? '<button class="boton claro chico" data-a="estadoRep" data-id="' + esc(r.id) + '" data-e="' + esc(r.estado) + '">Solo guardar la nota</button>' : '') +
        '<button class="boton claro chico" data-a="abrirChat" data-ced="' + esc(r.cedula) + '">Escribirle por el chat</button></div></section>';
    });
    app.innerHTML = h;
  }
  function fechaCorta(ms) { try { return new Date(ms).toLocaleDateString('es-CO', { timeZone: 'America/Bogota', day: '2-digit', month: '2-digit', year: 'numeric' }); } catch (e) { return ''; } }
  function cambiarEstado(n) {
    var id = n.getAttribute('data-id'), estado = n.getAttribute('data-e'), nota = (document.getElementById('n' + id) || {}).value || '';
    n.disabled = true;
    llamar('adminReporteEstado', { id: id, estado: estado, nota: nota }).then(function (r) {
      S.nota = r.ok ? { clase: 'ok', texto: estado === 'CERRADO' ? 'Reporte cerrado.' : nota.trim() && n.textContent === 'Solo guardar la nota' ? 'Nota guardada.' : 'Reporte en revisión.' } : { clase: 'mal', texto: r.mensaje };
      contadores(); cargarReportes(); window.scrollTo(0, 0);
    }).catch(function (e) { n.disabled = false; S.nota = { clase: 'mal', texto: 'No hubo conexión: ' + e.message }; pReportes(); });
  }

  /* ---------- Eventos ---------- */
  document.addEventListener('click', function (ev) {
    var n = ev.target.closest('[data-v],[data-a]');
    if (!n) return;
    if (n.hasAttribute('data-v')) { if (n.getAttribute('data-v') === 'chat') { S.chatCed = ''; S.conv = null; } S.verRep = ''; return ir(n.getAttribute('data-v')); }
    var a = n.getAttribute('data-a');
    if (a === 'otroCorreo') { S.paso = 'correo'; pEntrar(); }
    else if (a === 'salir') { llamar('adminSalir').catch(function () {}); salirLocal(); }
    else if (a === 'recargarHoy') cargarHoy();
    else if (a === 'recargarEnviados') cargarMensajes();
    else if (a === 'recargarAjustes') cargarAjustes();
    else if (a === 'verEnviados') ir('enviados');
    else if (a === 'volverEnviar') ir('enviar');
    else if (a === 'recargarChat') { S.nota = null; cargarChats(); }
    else if (a === 'abrirChat') { ev.preventDefault(); S.nota = null; S.borradorChat = ''; if (S.vista !== 'chat') { S.chatCed = n.getAttribute('data-ced'); ir('chat'); } else abrirChat(n.getAttribute('data-ced')); }
    else if (a === 'cerrarChat') { S.chatCed = ''; S.conv = null; S.nota = null; pChat(); }
    else if (a === 'verReporte') { ev.preventDefault(); S.verRep = n.getAttribute('data-id'); ir('reportes'); }
    else if (a === 'todosRep') { S.verRep = ''; pReportes(); }
    else if (a === 'recargarReportes') { S.nota = null; cargarReportes(); }
    else if (a === 'filtroRep') { S.filtroRep = n.getAttribute('data-f'); S.nota = null; pReportes(); }
    else if (a === 'estadoRep') cambiarEstado(n);
    else if (a === 'rapido') {
      S.borrador = { para: n.getAttribute('data-para'), tipo: 'RECORDATORIO', titulo: '', texto: PLANTILLAS[+n.getAttribute('data-p')], cuando: 'ya', fecha: '', hora: '', cedulas: {}, buscar: '' };
      ir('enviar');
    }
    else if (a === 'escribirSel') {
      S.borrador = { para: 'ELEGIDOS', tipo: 'MENSAJE', titulo: '', texto: '', cuando: 'ya', fecha: '', hora: '', cedulas: Object.assign({}, S.sel), buscar: '' };
      ir('enviar');
    }
    else if (a === 'tipo') { leerBorrador(); S.borrador.tipo = n.getAttribute('data-t'); pEnviar(); }
    else if (a === 'cuando') { leerBorrador(); S.borrador.cuando = n.getAttribute('data-c'); pEnviar(); }
    else if (a === 'plantilla') { leerBorrador(); S.borrador.texto = PLANTILLAS[+n.getAttribute('data-p')]; pEnviar(); }
    else if (a === 'cancelar') {
      n.disabled = true;
      llamar('adminCancelar', { id: n.getAttribute('data-id') }).then(function (r) {
        S.nota = r.ok ? { clase: 'ok', texto: 'Mensaje cancelado: no se enviará.' } : { clase: 'mal', texto: r.mensaje };
        cargarMensajes();
      }).catch(function (e) { S.nota = { clase: 'mal', texto: e.message }; pEnviados(); });
    }
  });
  document.addEventListener('change', function (ev) {
    var t = ev.target;
    if (t.hasAttribute('data-sel')) { var c = t.getAttribute('data-sel'); if (t.checked) S.sel[c] = true; else delete S.sel[c]; pintarSel(); }
    else if (t.hasAttribute('data-elegir')) { var e = t.getAttribute('data-elegir'); if (t.checked) S.borrador.cedulas[e] = true; else delete S.borrador.cedulas[e]; actualizarConteo(); }
    else if (t.name === 'para') { leerBorrador(); S.borrador.para = t.value; pEnviar(); }
  });
  document.addEventListener('input', function (ev) {
    var t = ev.target;
    if (t.id === 'texto' || t.id === 'titulo') {
      leerBorrador();
      var b = S.borrador;
      document.getElementById('cuenta').textContent = b.texto.length;
      document.getElementById('vTitulo').textContent = 'ODESA: ' + (b.titulo || TITULO_DEF[b.tipo]);
      document.getElementById('vTexto').textContent = b.texto || 'Tu mensaje…';
    } else if (t.id === 'buscarChat') { S.buscarChat = t.value; pintarListaChats();
    } else if (t.id === 'resp') { S.borradorChat = t.value;
    } else if (t.id === 'buscar') { S.borrador.buscar = t.value; document.getElementById('elegir').innerHTML = listaElegir(); }
  });
  function actualizarConteo() {
    var n = Object.keys(S.borrador.cedulas).length, o = document.querySelector('input[name=para][value=ELEGIDOS]');
    if (o) o.parentNode.querySelector('small').textContent = n + (n === 1 ? ' persona' : ' personas');
  }
  document.addEventListener('submit', function (ev) {
    if (ev.target.id === 'fCorreo') pedirCodigo(ev);
    else if (ev.target.id === 'fCodigo') entrar(ev);
    else if (ev.target.id === 'fEnviar') enviar(ev);
    else if (ev.target.id === 'fAjustes') guardarAjustes(ev);
    else if (ev.target.id === 'fChat') responder(ev);
  });
  document.addEventListener('keydown', function (ev) {
    if (ev.key === 'Enter' && !ev.shiftKey && ev.target.id === 'resp' && window.matchMedia('(pointer: fine)').matches) { ev.preventDefault(); responder(ev); }
  });
  document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible' && S.token && S.vista === 'hoy') cargarHoy(true); });

  /* ---------- Instalar ---------- */
  var esIphone = /iphone|ipad|ipod/i.test(navigator.userAgent);
  var instalada = (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true;
  var bInstalar = document.getElementById('instalar');
  window.addEventListener('beforeinstallprompt', function (ev) { ev.preventDefault(); invitacion = ev; bInstalar.hidden = false; });
  if (esIphone && !instalada) bInstalar.hidden = false;
  bInstalar.addEventListener('click', function () {
    if (invitacion) { invitacion.prompt(); invitacion.userChoice.then(function () { invitacion = null; bInstalar.hidden = true; }); }
    else if (esIphone) alertaSuave('En iPhone: abre esta página en Safari, toca Compartir y luego «Agregar a inicio».');
  });
  function alertaSuave(t) {
    var d = document.createElement('div'); d.className = 'nota aviso'; d.setAttribute('role', 'status'); d.textContent = t;
    app.insertBefore(d, app.firstChild); window.scrollTo(0, 0);
  }
  if ('serviceWorker' in navigator) { navigator.serviceWorker.register('sw.js').catch(function () {}); }

  /* ---------- Arranque ---------- */
  if (S.token) iniciarPanel(); else pEntrar();
})();
</script>
</body>
</html>
